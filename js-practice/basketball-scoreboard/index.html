<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basketball Scoreboard</title>
    <link rel="icon" href="images/Favicon.png">
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
     <img src="images/Desktop.jpg" alt="Basketball scoreboard background">
    <h1 class="title">Basketball Scoreboard</h1>

    <div class="board">

      <!-- SCORES -->
      <div class="teams">
        <div class="team">
          <p class="team-name">Home</p>
          <p class="score" id="home-score">0</p>
        </div>
        <p class="vs">VS</p>
        <div class="team">
          <p class="team-name">Guest</p>
          <p class="score" id="guest-score">0</p>
        </div>
      </div>

      <hr class="divider" />

      <!-- HOME BUTTONS -->
      <p class="lbl">Home points</p>
      <div class="btn-grid">
        <button onclick="addScore('home', 1)">+1 point</button>
        <button onclick="addScore('home', 2)">+2 points</button>
        <button class="full" onclick="addScore('home', 3)">+3 points</button>
      </div>

      <!-- GUEST BUTTONS -->
      <p class="lbl">Guest points</p>
      <div class="btn-grid">
        <button onclick="addScore('guest', 1)">+1 point</button>
        <button onclick="addScore('guest', 2)">+2 points</button>
        <button class="full" onclick="addScore('guest', 3)">+3 points</button>
      </div>

      <!-- WINNER MESSAGE -->
      <p class="winner" id="winner"></p>

      <!-- RESET -->
      <div class="reset-row">
        <button class="reset-btn" onclick="resetGame()">Reset game</button>
      </div>

    </div>

    <script src="index.js"></script>
  </body>
</html>
